[project]
name = "resnype"
version = "0.1.0"
description = "Telegram bot for Resy reservation alerts and one-click booking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "aiohttp>=3.9.1",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.2",
    "pydantic-settings>=2.1.0",
    "cryptography>=41.0.7",
    "python-dotenv>=1.0.0",
]

[project.scripts]
resnype = "resnype.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resnype"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

