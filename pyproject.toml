[project]
name = "envoy"
version = "0.1.0"
description = "Personal AI agent on Telegram - reservations, bookings, and more"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "aiohttp>=3.9.1",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.2",
    "pydantic-settings>=2.1.0",
    "cryptography>=41.0.7",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
]

[project.scripts]
envoy = "envoy.main:main"
envoy-dev = "envoy.main:main_dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envoy"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "watchfiles>=0.21.0",
]
