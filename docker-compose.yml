services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql://resnype:resnype@db:5432/resnype
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    networks:
      - resnype-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"  # Expose PostgreSQL to host for local tools
    environment:
      - POSTGRES_USER=resnype
      - POSTGRES_PASSWORD=resnype
      - POSTGRES_DB=resnype
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resnype"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resnype-network

volumes:
  postgres_data:

networks:
  resnype-network:
    driver: bridge

